name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # A tag can point anywhere — never draft artifacts from unverified code.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Extra targets only where they're used (the macOS legs cross-compile).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri-action doesn't take cargo flags; a fetch --locked beforehand
      # fails the leg if Cargo.lock disagrees with the manifests.
      - name: Enforce lockfile
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      # Code signing and notarization switch on by themselves once the
      # secrets exist (see packaging/README.md for which ones). Missing
      # secrets expand to empty strings, and an empty APPLE_CERTIFICATE would
      # make the bundler try to import nothing — so only non-empty values are
      # exported to the job environment, and an unsigned build is the
      # unchanged default until then.
      - name: Configure Apple signing (when secrets are present)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          exported=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              {
                echo "$name<<__EOF__"
                echo "$value"
                echo "__EOF__"
              } >> "$GITHUB_ENV"
              exported=$((exported + 1))
            fi
          done
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::Apple signing enabled ($exported variables set)."
            if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
              echo "::warning::Signing without notarization: APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID are all required to notarize."
            fi
          else
            echo "::notice::No APPLE_CERTIFICATE secret; building unsigned."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MCPanel ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
