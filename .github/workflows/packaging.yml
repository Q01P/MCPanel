name: Packaging

# Keep the Homebrew cask and winget manifests in step with releases.
#
# Runs when a release is *published* — not when the build job drafts it —
# because only a published release has public asset URLs and digests for
# scripts/update-packaging.mjs to read. The result is opened as a pull
# request rather than pushed to main, so it works whether or not main is
# protected and the diff is reviewable before it lands.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # msiinfo reads the ProductCode out of the MSI; winget needs it to
      # recognise the installed package for upgrades and uninstalls.
      - name: Install msitools
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Update cask and manifests from the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-packaging.mjs "$TAG"

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if git diff --quiet -- Casks packaging; then
            echo "Packaging already matches $TAG; nothing to do."
            exit 0
          fi
          branch="packaging/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Casks packaging
          git commit -m "packaging: sync cask and winget manifests for $TAG"
          git push --force-with-lease origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "packaging: sync cask and winget manifests for $TAG" \
            --body "Generated by the Packaging workflow from the published $TAG release: checksums from the release asset digests, ProductCode from the MSI. Merge to update the Homebrew tap; copy \`packaging/winget/manifests\` into a winget-pkgs submission." \
          || echo "Pull request already exists for $branch."
